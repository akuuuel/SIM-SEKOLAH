    <!-- PWA Service Worker Registration & Install Prompt Capture -->
    <script>
      // Tangkap event instalasi PWA agar tombol install di aplikasi bisa memicu pop-up resmi
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-installable'));
      });

      // Registrasi Service Worker di semua perangkat & jaringan (Instan & Handal)
      if ('serviceWorker' in navigator) {
        const registerSW = () => {
          navigator.serviceWorker.register('/sw.js?v=48', { scope: '/' })
            .then(function(reg) {
              console.log('[PWA] ServiceWorker registered:', reg.scope);
              reg.update();

              // Cache warming proaktif: perintahkan SW untuk menyimpan semua bundle aset yang dimuat
              const triggerCacheWarming = (registration) => {
                const assetsToCache = [];
                document.querySelectorAll('script[src], link[rel=stylesheet][href]').forEach(el => {
                  const url = el.src || el.href;
                  if (url && (url.includes('/assets/') || url.startsWith(location.origin + '/assets/'))) {
                    assetsToCache.push(url);
                  }
                });
                const target = registration.active || navigator.serviceWorker.controller;
                if (assetsToCache.length && target) {
                  target.postMessage({ type: 'CACHE_ASSETS', urls: assetsToCache });
                }
              };

              if (document.readyState === 'complete') {
                setTimeout(() => triggerCacheWarming(reg), 800);
              } else {
                window.addEventListener('load', () => setTimeout(() => triggerCacheWarming(reg), 800));
              }
            })
            .catch(function(err) {
              console.warn('[PWA] ServiceWorker registration failed:', err);
            });
        };
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          registerSW();
        } else {
          window.addEventListener('load', registerSW);
        }
      }
    </script>
